profane_comedy:
  label: "🤬 Profane Comedy"
  description: "Frequent swearing and crude language as natural character speech"
  prompt: "Describe interactions and comedic frustrations with abrasive, high-energy realism. Dialogue must be laced with creative swearing, colorful insults, and crude slang as natural everyday speech. Narration should lean into comedic anger, chaotic arguments, and unhinged vocal exchanges."
