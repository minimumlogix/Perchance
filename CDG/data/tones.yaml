  prompt: "Frame scenes with realistic observations about careers, dating fatigue, domestic chaos, and social awkwardness. Dialogue should be witty, relatable, and packed with dry complaints and mature romantic banter. Narration should treat daily adult struggles and relationship absurdities with comedic flair."
