  prompt: "Describe grand monuments, serious leaders, and solemn rituals while deflating their dignity with casual disrespect. Dialogue must be cheekily dismissive, mocking heroic expectations, authority, and solemn traditions. Narration should refuse to take anything seriously, treating even profound moments with playful mockery."
