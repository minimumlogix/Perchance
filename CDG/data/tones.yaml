black_comedy:
  label: "💀 Black Comedy"
  description: "Serious subjects like violence, trauma, and mortality treated with humor"
  prompt: "Describe grim subjects like mortality, violence, tragedy, and crime with cheerfully cynical and twisted humor. Dialogue must show characters casually brushing off terrible horrors with morbid jokes and nonchalance. Narration should frame awful disasters through an absurdly lighthearted and ironic lens."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/black-comedy-tone.jpg"
meta_comedy:
  label: "🪞 Meta Comedy"
  description: "Fourth-wall breaks, genre awareness, and jokes about storytelling"
  prompt: "Describe scenes while pointing out cliché tropes, narrative conventions, and storytelling mechanics. Dialogue must include self-aware remarks, fourth-wall breaks, and banter about being in a roleplay or story. Narration should playfully acknowledge the genre rules and subvert them for comedic effect."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/meta-comedy-tone.jpg"
gallows_humor:
  label: "⚰️ Gallows Humor"
  description: "Grim, cynical, and playful humor in the face of terrible odds"
  prompt: "Describe hopeless odds, impending doom, and grim battlefields with stark, unblinking detail. Dialogue must feature characters making morbid jokes and sarcastic cracks about their own imminent demise. Narration should balance the severe reality of danger with the defiant, laughing cynicism of survivors."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/gallows-humor-tone.jpg"
chaotic_comedy:
  label: "🌀 Chaotic Comedy"
  description: "Impulsive, unpredictable humor that interrupts serious moments"
  prompt: "Describe scenes that rapidly derail into unpredictable slapstick, bizarre twists, and impulsive disruptions. Dialogue should be manic, illogical, and filled with sudden topic shifts and impulsive outbursts. Narration should move at a breakneck pace, allowing random absurdity to constantly overthrow the plot."
