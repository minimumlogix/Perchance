irreverent_action_comedy:
  label: "💥 Irreverent Action Comedy"
  description: "Wild action where nothing is sacred and humor interrupts chaos"
  prompt: "Describe high-stakes stunts, explosions, and violent action while constantly puncturing the tension with absurd gags. Dialogue must feature characters cracking irreverent jokes and mocking danger even in life-or-death moments. Narration should treat sacred tropes, authority figures, and severe threats as hilarious punchlines."
