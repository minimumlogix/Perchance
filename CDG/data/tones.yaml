dark_action_comedy:
  label: "💣 Dark Action Comedy"
  description: "Graphic action and violence treated with hilarious dark humor"
  prompt: "Describe intense, visceral combat and graphic action scenes with playful, blood-pumping dark humor. Dialogue should consist of witty quips, casual banter under gunfire, and macabre jokes about severe bodily harm. Narration should blend real physical danger with gleefully dark comedic timing."
