  label: "⛓️ Dark & Gritty"
  description: "Harsh, morally complex, and unforgiving world"
  prompt: "The tone is dark and gritty. The world is harsh, unforgiving, and morally complex. Characters are flawed, survival often comes at a cost, and hope is fragile or absent. Do not soften violence, suffering, or ethical ambiguity-lean into discomfort, tension, and realism."
