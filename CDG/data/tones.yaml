  label: "🎭 Dramatic"
  description: "Emotional conflict and tension"
  prompt: "Describe high-stakes confrontations, emotional turning points, and intense body language with cinematic power. Dialogue must be emotionally charged, passionate, and heavy with personal conflict and hidden secrets. Narration should build gripping narrative tension where every choice carries significant consequences."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/dramatic-tone.jpg"
operatic:
  label: "🎻 Operatic"
  description: "Dramatic extremes and larger-than-life encounters"
  prompt: "Describe majestic halls, stormy battlegrounds, and larger-than-life backdrops with grand, sweeping flair. Dialogue must be melodramatic, passionate, highly eloquent, and filled with grand proclamations. Narration should treat personal rivalries and romances as titanic, mythic struggles of epic destiny."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/operatic-tone.jpg"
epic:
  label: "🌌 Epic"
  description: "Grand, mythic, and high-stakes scale"
  prompt: "Describe vast empires, apocalyptic forces, and monumental battlefields with mythic grandeur. Dialogue must carry historical gravity, profound authority, and the weight of nations or realms. Narration should make every event feel legendary, world-shaping, and timeless in scale."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/epic-tone.jpg"
serious:
  label: "😐 Serious"
  description: "Realistic, grave, and meaningful"
  prompt: "Describe realistic settings, professional protocols, and tactical details with sober accuracy. Dialogue must be mature, purposeful, grave, and free of silly distractions or casual banter. Narration should treat the plot and character responsibilities with profound weight and realism."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/serious-tone.jpg"
grounded:
  label: "🌍 Grounded"
  description: "Grounded, realistic, and believable characters"
  prompt: "Describe physical environments, injuries, stamina limits, and mundane realities with tangible realism. Dialogue must be authentic and natural, reflecting how real people actually talk under pressure. Narration should avoid melodrama or convenient miracles, focusing on believable cause and effect."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/grounded-tone.jpg"
cynical:
  label: "😒 Cynical"
  description: "Weary worldview, failed systems, and skepticism"
  prompt: "Describe corrupt institutions, weathered streets, and broken promises with weary, sharp-eyed realism. Dialogue should be dry, guarded, skeptical, and quick to call out naive idealism or lies. Narration should expose the selfish motives and moral compromises underlying human behavior."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/cynical-tone.jpg"
stoic:
  label: "🛡️ Stoic"
  description: "Suppressed emotion under quiet discipline"
  prompt: "Describe harsh conditions, injuries, and overwhelming pressure with calm, disciplined restraint. Dialogue should be sparse, steady, controlled, and devoid of panicked complaints or overt emotional display. Narration should highlight inner fortitude, quiet duty, and the unyielding endurance of pain."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/stoic-tone.jpg"
clinical:
  label: "🔬 Clinical"
  description: "Factual, detached narration without bias"
  prompt: "Describe bodies, environments, and violent trauma with cold, detached, and scientific precision. Dialogue should be objective, analytical, concise, and stripped of emotional warmth or hysteria. Narration must report facts, biological metrics, and tactical observations like an impartial medical or technical log."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/clinical-tone.jpg"
documentary:
  label: "📹 Documentary"
  description: "Objective, detached, and factual observation"
  prompt: "Describe scenes with detailed, objective observational framing, as if captured through a detached camera lens. Dialogue should sound natural, unscripted, and accompanied by behavioral analysis. Narration must report events, cultural contexts, and character actions with journalistic impartiality."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/documentary-tone.jpg"
satirical_biting:
  label: "🎯 Biting Satire"
  description: "Sharp wit, social critique, and exposing hypocrisy"
  prompt: "Describe elite hypocrisy, bureaucratic absurdity, and corporate greed with razor-sharp parody. Dialogue must be bitingly sarcastic, smugly corrupt, or weaponized with witty double meanings. Narration should mercilessly dissect foolish social conventions and pretenses with intellectual mockery."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/satirical-biting-tone.jpg"
existential:
  label: "🌌 Existential"
  description: "Focus on identity, mortality, and consciousness"
  prompt: "Describe vast cosmic horizons, quiet voids, and the fragility of consciousness with philosophical depth. Dialogue should question identity, purpose, free will, memory, and the nature of existence. Narration must explore the deep psychological weight of living in an enigmatic universe."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/existential-tone.jpg"
surreal:
  label: "🍄 Surreal"
  description: "Dreamlike logic bending with emotional coherence"
  prompt: "Describe shifting architectures, liquid clocks, impossible geometries, and symbolic imagery with dreamlike fluency. Dialogue should follow dream-logic, enigmatic metaphors, and poetic intuition. Narration must blend impossible phenomena with emotional coherence as if reality were a waking dream."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/surreal-tone.jpg"
whimsical:
  label: "🦄 Whimsical"
  description: "Dreamlike, imaginative, and surreal rules"
  prompt: "Describe wondrous curiosities, enchanted oddities, and eccentric landscapes with childlike delight. Dialogue should be quirky, curious, playful, and charmed by the strangeness of the world. Narration should celebrate creative magic, delightful unpredictability, and lighthearted wonder."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/whimsical-tone.jpg"
chaotic:
  label: "🌀 Chaotic"
  description: "Unpredictable pacing and volatile impulses"
  prompt: "Describe volatile environments where plans instantly collapse and unpredictable hazards erupt. Dialogue must be impulsive, erratic, loud, and constantly reacting to sudden shifts in the situation. Narration should embrace manic energy, sudden turnarounds, and wild sensory overload."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/chaotic-tone.jpg"
campy:
  label: "💅 Campy"
  description: "Self-aware humor and over-the-top theatricality"
  prompt: "Describe vibrant costumes, exaggerated villain lairs, and theatrical set pieces with playful excess. Dialogue must be deliciously over-the-top, sassy, theatrical, and packed with dramatic one-liners. Narration should celebrate fun absurdity, melodramatic poses, and self-aware extravagance."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/campy-tone.jpg"
hallucinatory:
  label: "🔮 Hallucinatory"
  description: "Distorted senses where dreams and reality blur"
  prompt: "Describe bleeding colors, warped sounds, shifting shadows, and blurred senses with disorienting power. Dialogue should waver between paranoid clarity, strange whispers, and confusing echoes. Narration must blur the line between waking reality, delirium, and psychological nightmare."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/hallucinatory-tone.jpg"
reverent:
  label: "🛐 Reverent"
  description: "Sacred seriousness, quiet awe, and dignity"
  prompt: "Describe ancient shrines, sacred relics, and hallowed halls with breathless awe and solemn dignity. Dialogue should be respectful, measured, humble, and imbued with deep spiritual gravity. Narration must treat sacred lore, rituals, and profound oaths with sacred seriousness."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/reverent-tone.jpg"
decadent:
  label: "🍷 Decadent"
  description: "Indulgence, excess, and rotting luxury"
  prompt: "Describe gilded palaces, velvet draperies, overflowing wine, and decaying splendor with lush sensory detail. Dialogue must be lazy, hedonistic, cynical, and dripping with sophisticated indulgence. Narration should expose the moral decay, rotting luxury, and hollow excess beneath the beauty."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/decadent-tone.jpg"
unhinged:
  label: "🤪 Unhinged"
  description: "Manic energy and erratic, unstable behavior"
  prompt: "Describe erratic movements, wild facial expressions, and sudden shifts in danger with manic intensity. Dialogue must be volatile, fractured, rapidly swinging between laughs, threats, and sudden intensity. Narration should convey escalating psychological instability and explosive unpredictability."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/unhinged-tone.jpg"
