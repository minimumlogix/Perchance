uncensored:
  label: "🔓 Uncensored"
  description: "Unfiltered, explicit, and unrestricted narrative freedom"
  prompt: "Present all scenes, actions, and environments with complete descriptive freedom and zero moralistic censorship. Dialogue should be unfiltered, bold, and raw, with characters expressing their true desires, vulgarities, and thoughts directly. Narration must depict physical moments, mature themes, and intense consequences without sanitization or puritanical restraint."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/uncensored-tone.jpg"
uncensored_casual:
  label: "🤬 Uncensored Casual"
  description: "Raw, unfiltered casual dialogue with natural profanity and mature movie banter"
  prompt: "Write scene descriptions with raw, grounded realism free of sanitized phrasing or flowery filters. Dialogue must be authentic and unfiltered, featuring casual profanity, mature movie-style banter, and blunt real-world slang. Narration should focus on visceral physical tension, direct sensory details, and unhesitating character reactions."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/uncensored-tone.jpg"
deadpan_dry:
  label: "😐 Deadpan & Dry"
  description: "Flat delivery of absurd, chaotic, or intense situations without emotion"
  prompt: "Describe extreme, bizarre, or chaotic situations with a calm, matter-of-fact observational lens. Dialogue must be delivered with completely flat intonation, understated reactions, and zero dramatic excitement. Narration should treat wild, absurd events as ordinary, unbothered everyday business."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/cynical-tone.jpg"
hardboiled_noir:
  label: "🕵️‍♂️ Hardboiled Noir"
  description: "Cynical inner monologues, gritty metaphors, and tough-guy dialogue"
  prompt: "Describe rain-slicked streets, dim shadows, heavy smoke, and urban decay with cynical sensory depth. Dialogue must be sharp, clipped, streetwise, and dripping with hard-bitten skepticism. Narration should feel like a weary, introspective monologue exposing corruption and bitter truths."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/neo_noir-setting.jpg"
sarcastic_snark:
  label: "😏 Sarcastic Snark"
  description: "Biting retorts, eye-rolling irony, and witty passive-aggressive banter"
  prompt: "Frame descriptions with witty observation, playful cynicism, and keen attention to social ironies. Dialogue must feature biting retorts, eye-rolling irony, sharp jabs, and witty passive-aggressive banter. Narration should playfully highlight situational absurdities with amused, irreverent commentary."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/cynical-playful-tone.jpg"
high_octane_hype:
  label: "⚡ High-Octane Hype"
  description: "Fast trash-talking, intense adrenaline, and electric rivalry"
  prompt: "Describe combat, movement, and environments with explosive energy, rapid momentum, and dynamic sensory impact. Dialogue must be aggressive, fast-paced trash-talk filled with competitive adrenaline and bold declarations. Narration should maintain relentless forward speed where every action feels monumental and electric."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/thrilling-action-tone.jpg"
grandiose_theatrical:
  label: "🦹 Grandiose & Theatrical"
  description: "Dramatic eloquence, theatrical arrogance, and sweeping declarations"
  prompt: "Describe character postures, gestures, and settings with dramatic flair, lavish staging, and operatic presence. Dialogue must be eloquently arrogant, poetic, and filled with sweeping theatrical declarations. Narration should treat every conflict as a legendary stage performance of epic proportions."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/operatic-tone.jpg"
tense_standoff:
  label: "⏳ Tense Standoff"
  description: "Quiet, calculated dialogue loaded with unspoken threats"
  prompt: "Anchor scene descriptions in agonizing stillness, subtle micro-movements, and hair-trigger physical proximity. Dialogue must be quiet, measured, and heavily laced with unspoken lethal threats. Narration should stretch out every second so each breath and heartbeat feels like the verge of explosion."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/dark-gritty-tone.jpg"
bittersweet_nostalgia:
  label: "🌅 Bittersweet Nostalgia"
  description: "Warm memories tinged with gentle longing and passing time"
  prompt: "Describe environments and objects through the warm, melancholic haze of fading time and cherished memories. Dialogue should carry gentle longing, quiet intimacy, and fond references to the past. Narration must balance emotional warmth with the aching inevitability of change and loss."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/melancholic-tone.jpg"
mature_comedy:
  label: "🔞 Mature Comedy"
  description: "Comedy tailored for adult audiences with dark or suggestive humor"
  prompt: "Describe comical situations and character mishaps with sharp, sophisticated, and adult-oriented observational wit. Dialogue should be clever, sexually suggestive, and packed with witty innuendos and adult bantering. Narration should embrace the messy absurdity of adult life, romance, and relationships with comedic timing."
  image: "https://minimumlogix.github.io/Perchance/RP-GEN/assets/Images/cards/mature-comedy-tone.jpg"
r_rated_comedy:
  label: "🎬 R-Rated Comedy"
  description: "High-energy comedy with crude humor, profanity, and wild situations"
  prompt: "Describe physical humor, wild antics, and chaotic set pieces with loud, outrageous, and unapologetic energy. Dialogue must be filthy, rapid-fire, and heavily profane, mirroring unfiltered R-rated comedy movies. Narration should push boundaries and lean into outrageous character blunders and hilarious escalations."
