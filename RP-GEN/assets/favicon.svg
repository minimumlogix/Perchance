<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="die-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    @keyframes roll-and-pause {
      0% { transform: rotate(0deg) scale(1); }
      10% { transform: rotate(180deg) scale(0.9); }
      20% { transform: rotate(360deg) scale(1); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .die-group {
      animation: roll-and-pause 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 32px 32px;
    }
    @keyframes f1 {
      0%, 3% { opacity: 1; }
      4%, 100% { opacity: 0; }
    }
    @keyframes f2 {
      0%, 3% { opacity: 0; }
      4%, 7% { opacity: 1; }
      8%, 100% { opacity: 0; }
    }
    @keyframes f3 {
      0%, 7% { opacity: 0; }
      8%, 11% { opacity: 1; }
      12%, 100% { opacity: 0; }
    }
    @keyframes f4 {
      0%, 11% { opacity: 0; }
      12%, 14% { opacity: 1; }
      15%, 100% { opacity: 0; }
    }
    @keyframes f5 {
      0%, 14% { opacity: 0; }
      15%, 18% { opacity: 1; }
      19%, 100% { opacity: 0; }
    }
    @keyframes f6 {
      0%, 18% { opacity: 0; }
      19%, 100% { opacity: 1; }
    }
    .face1 { animation: f1 4s infinite; }
    .face2 { animation: f2 4s infinite; }
    .face3 { animation: f3 4s infinite; }
    .face4 { animation: f4 4s infinite; }
    .face5 { animation: f5 4s infinite; }
    .face6 { animation: f6 4s infinite; }
  </style>
  <g class="die-group" filter="url(#shadow)">
    <rect x="8" y="8" width="48" height="48" rx="10" fill="url(#die-grad)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Face 1 -->
    <g class="face1">
      <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
    </g>
    <!-- Face 2 -->
    <g class="face2">
      <circle cx="44" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="20" cy="44" r="3.5" fill="#ffffff" />
    </g>
    <!-- Face 3 -->
    <g class="face3">
      <circle cx="44" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
      <circle cx="20" cy="44" r="3.5" fill="#ffffff" />
    </g>
    <!-- Face 4 -->
    <g class="face4">
      <circle cx="20" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="44" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="20" cy="44" r="3.5" fill="#ffffff" />
      <circle cx="44" cy="44" r="3.5" fill="#ffffff" />
    </g>
    <!-- Face 5 -->
    <g class="face5">
      <circle cx="20" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="44" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
      <circle cx="20" cy="44" r="3.5" fill="#ffffff" />
      <circle cx="44" cy="44" r="3.5" fill="#ffffff" />
    </g>
    <!-- Face 6 -->
    <g class="face6">
      <circle cx="20" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="44" cy="20" r="3.5" fill="#ffffff" />
      <circle cx="20" cy="32" r="3.5" fill="#ffffff" />
      <circle cx="44" cy="32" r="3.5" fill="#ffffff" />
      <circle cx="20" cy="44" r="3.5" fill="#ffffff" />
      <circle cx="44" cy="44" r="3.5" fill="#ffffff" />
    </g>
  </g>
</svg>
