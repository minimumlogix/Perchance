<script>
  function toggleManualDarkMode() {
    let newColorScheme = (getCurrentColorScheme() === "dark" ? "light" : "dark");
    localStorage.forceColorScheme = newColorScheme;
    setColorScheme(newColorScheme);
    // if chosen mode matches current OS default, we remove manual "forced" mode:
    let systemColorScheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
    if(systemColorScheme === newColorScheme) {
      localStorage.removeItem("forceColorScheme");
    }
  }
  function getCurrentColorScheme() {
    if(localStorage.forceColorScheme !== undefined) {
      return localStorage.forceColorScheme;
    } else {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
    }
  }
  function setColorScheme(scheme) {
    if(scheme !== "dark" && scheme !== "light") throw new Error("scheme should be 'light' or 'dark'");
    document.querySelector("#darkModeBtn").textContent = (scheme === "dark" ? "🌄" : "🌃");
    if(scheme === "dark") {
      document.documentElement.style.colorScheme = "dark";
      document.body.style.color = "#d8d4cf";
      document.body.style.backgroundColor = "#131516";
      document.documentElement.style.setProperty('--box-color', '#2a2a2a');
    } else {
      document.documentElement.style.colorScheme = "light";
      document.body.style.color = "black";
      document.body.style.backgroundColor = "white";
      document.documentElement.style.setProperty('--box-color', '#ebebeb');
    }
  }
  // during page load, set the chosen mode based on localStorage value if it exists:
  if(localStorage.forceColorScheme !== undefined) {
    setColorScheme(localStorage.forceColorScheme);
  } else {
    // user has not manually overwritten, so we use OS default:
    let systemIsInDarkMode = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    setColorScheme(systemIsInDarkMode ? "dark" : "light");
  }
</script>

<script>
  let currentActiveSelectEl = null;

  function toggleSelectDrawer(selectEl, wrapper) {
    const drawer = document.getElementById('customDropdownDrawer');
    const scrollBox = document.getElementById('customDropdownDrawerContent');
    
    if (currentActiveSelectEl === selectEl && drawer.classList.contains('open')) {
      drawer.classList.remove('open');
      wrapper.classList.remove('open');
      currentActiveSelectEl = null;
      return;
    }

    if (currentActiveSelectEl) {
      const prevWrapper = document.getElementById('custom-select-' + currentActiveSelectEl.id);
      if (prevWrapper) prevWrapper.classList.remove('open');
    }

    currentActiveSelectEl = selectEl;
    wrapper.classList.add('open');

    const originalOptions = Array.from(selectEl.options);
    const itemsCount = originalOptions.length;
    scrollBox.innerHTML = '';
    
    if (itemsCount === 0) {
      drawer.classList.remove('open');
      return;
    }

    // Clone list 3 times for looping infinite scroll (horizontal)
    for (let copy = 0; copy < 3; copy++) {
      originalOptions.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = 'custom-select-card';
        card.textContent = opt.textContent;
        card.dataset.value = opt.value;
        card.dataset.index = idx;
        
        if (idx === selectEl.selectedIndex) {
          card.classList.add('selected');
        }

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          selectEl.selectedIndex = idx;
          
          selectEl.dispatchEvent(new Event('change', { bubbles: true }));
          if (typeof selectEl.onchange === 'function') {
            selectEl.onchange();
          }
          
          const labelSpan = wrapper.querySelector('.custom-select-label');
          if (labelSpan) labelSpan.textContent = opt.textContent;
          
          scrollBox.querySelectorAll('.custom-select-card').forEach(c => {
            if (parseInt(c.dataset.index) === idx) {
              c.classList.add('selected');
            } else {
              c.classList.remove('selected');
            }
          });

          drawer.classList.remove('open');
          wrapper.classList.remove('open');
          currentActiveSelectEl = null;
        });

        scrollBox.appendChild(card);
      });
    }

    drawer.classList.add('open');

    function scrollToActive() {
      const middleStartIndex = itemsCount;
      const selectedIdx = selectEl.selectedIndex;
      const targetCard = scrollBox.children[middleStartIndex + selectedIdx];
      if (targetCard) {
        scrollBox.scrollLeft = targetCard.offsetLeft - (scrollBox.clientWidth / 2) + (targetCard.clientWidth / 2);
      }
    }

    // Wait for drawer to render to get accurate positioning dimensions
    setTimeout(scrollToActive, 20);
  }

  function initializeCustomSelect(selectEl) {
    if (!selectEl) return;
    if (selectEl.classList.contains('custom-select-hidden')) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'custom-select-wrapper';
    wrapper.id = 'custom-select-' + selectEl.id;

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'custom-select-trigger';
    
    const labelSpan = document.createElement('span');
    labelSpan.className = 'custom-select-label';
    
    const arrowSpan = document.createElement('span');
    arrowSpan.className = 'custom-select-arrow';
    arrowSpan.textContent = '▼';
    
    trigger.appendChild(labelSpan);
    trigger.appendChild(arrowSpan);

    selectEl.parentNode.insertBefore(wrapper, selectEl.nextSibling);
    wrapper.appendChild(trigger);
    selectEl.classList.add('custom-select-hidden');

    function updateTriggerText() {
      const selectedOption = selectEl.options[selectEl.selectedIndex];
      labelSpan.textContent = selectedOption ? selectedOption.textContent : '';
    }

    updateTriggerText();

    const observer = new MutationObserver(() => {
      updateTriggerText();
    });
    observer.observe(selectEl, { childList: true, attributes: true, subtree: true });

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSelectDrawer(selectEl, wrapper);
    });
  }

  // Close dropdowns on document click
  document.addEventListener('click', (e) => {
    const isTrigger = e.target.closest('.custom-select-trigger');
    const isDrawer = e.target.closest('#customDropdownDrawer');
    
    if (!isTrigger && !isDrawer && currentActiveSelectEl) {
      const drawer = document.getElementById('customDropdownDrawer');
      drawer.classList.remove('open');
      
      const wrapper = document.getElementById('custom-select-' + currentActiveSelectEl.id);
      if (wrapper) wrapper.classList.remove('open');
      
      currentActiveSelectEl = null;
    }
  });

  // Convert all selects in settings panel once DOM content is loaded
  function initAll() {
    const settingsSelects = document.querySelectorAll('div[style*="flex-wrap:wrap"] select');
    settingsSelects.forEach(select => {
      initializeCustomSelect(select);
    });

    const scrollBox = document.getElementById('customDropdownDrawerContent');
    if (scrollBox) {
      scrollBox.addEventListener('scroll', () => {
        if (!currentActiveSelectEl) return;
        const itemsCount = currentActiveSelectEl.options.length;
        if (itemsCount === 0) return;

        const totalWidth = scrollBox.scrollWidth;
        const singleSetWidth = totalWidth / 3;

        if (scrollBox.scrollLeft < singleSetWidth - (scrollBox.clientWidth / 2)) {
          scrollBox.scrollLeft += singleSetWidth;
        } else if (scrollBox.scrollLeft >= (singleSetWidth * 2) - (scrollBox.clientWidth / 2)) {
          scrollBox.scrollLeft -= singleSetWidth;
        }
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }
</script>
