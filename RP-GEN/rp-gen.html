<!-- DARK MODE STUFF -->
<div style="position:fixed; bottom:0.5rem; left:0.5rem; z-index:10;">
  <button id="darkModeBtn" style="cursor:pointer;" onclick="window.toggleManualDarkMode(); createCommentsSectionHtml();">ðŸŒƒ</button>
</div>
<script>
  function toggleManualDarkMode() {
    let newColorScheme = (getCurrentColorScheme() === "dark" ? "light" : "dark");
    localStorage.forceColorScheme = newColorScheme;
    setColorScheme(newColorScheme);
    // if chosen mode matches current OS default, we remove manual "forced" mode:
    let systemColorScheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
    if(systemColorScheme === newColorScheme) {
      localStorage.removeItem("forceColorScheme");
    }
  }
  function getCurrentColorScheme() {
    if(localStorage.forceColorScheme !== undefined) {
      return localStorage.forceColorScheme;
    } else {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
    }
  }
  function setColorScheme(scheme) {
    if(scheme !== "dark" && scheme !== "light") throw new Error("scheme should be 'light' or 'dark'");
    document.querySelector("#darkModeBtn").textContent = (scheme === "dark" ? "ðŸŒ„" : "ðŸŒƒ");
    if(scheme === "dark") {
      document.documentElement.style.colorScheme = "dark";
      document.body.style.color = "#d8d4cf";
      document.body.style.backgroundColor = "#131516";
      document.documentElement.style.setProperty('--box-color', '#2a2a2a');
    } else {
      document.documentElement.style.colorScheme = "light";
      document.body.style.color = "black";
      document.body.style.backgroundColor = "white";
      document.documentElement.style.setProperty('--box-color', '#ebebeb');
    }
  }
  // during page load, set the chosen mode based on localStorage value if it exists:
  if(localStorage.forceColorScheme !== undefined) {
    setColorScheme(localStorage.forceColorScheme);
  } else {
    // user has not manually overwritten, so we use OS default:
    let systemIsInDarkMode = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    setColorScheme(systemIsInDarkMode ? "dark" : "light");
  }
</script>

  .custom-dropdown-drawer.open.has-search .custom-dropdown-search-wrapper {
    display: flex;
  }

  .search-icon {
    position: absolute;
    left: 28px;
    font-size: 85%;
    opacity: 0.5;
    pointer-events: none;
  }

  #customDropdownSearchInput {
    width: 100%;
    padding: 6px 12px 6px 32px;
    background: var(--box-color, #ebebeb);
    border: 1px solid rgba(128, 128, 128, 0.2);
    border-radius: 20px;
    font-size: 85%;
    font-family: inherit;
    color: inherit;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #customDropdownSearchInput:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
  }

  html[style*="dark"] #customDropdownSearchInput:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
  }

  #customDropdownSearchClear {
    position: absolute;
    right: 28px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 85%;
    opacity: 0.5;
    padding: 4px;
    display: none;
    color: inherit;
    line-height: 1;
  }

  #customDropdownSearchClear:hover {
    opacity: 0.8;
  }

  /* Drawer footer (Done / Clear) */
  .custom-dropdown-drawer-footer {
    display: none;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 6px 14px;
    border-top: 1px solid rgba(128, 128, 128, 0.1);
    box-sizing: border-box;
    width: 100%;
    background: rgba(0, 0, 0, 0.02);
  }

  html[style*="dark"] .custom-dropdown-drawer-footer {
    background: rgba(255, 255, 255, 0.02);
    border-color: rgba(255, 255, 255, 0.05);
  }

  .custom-dropdown-drawer.open.is-multi .custom-dropdown-drawer-footer {
    display: flex;
  }

  .drawer-footer-clear {
    background: none;
    border: 1px solid rgba(128, 128, 128, 0.3);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 80%;
    cursor: pointer;
    color: inherit;
    opacity: 0.75;
    transition: opacity 0.15s, border-color 0.15s;
  }

  .drawer-footer-clear:hover {
    opacity: 1;
    border-color: rgba(239, 68, 68, 0.6);
    color: #ef4444;
  }

  .drawer-footer-done {
    background: #3b82f6;
    border: none;
    border-radius: 6px;
    padding: 4px 14px;
    font-size: 80%;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: background 0.15s, transform 0.1s;
  }

  .drawer-footer-done:hover {
    background: #2563eb;
  }

  .drawer-footer-done:active {
    transform: scale(0.97);
  }

  html[style*="dark"] .drawer-footer-done {
    background: #2563eb;
  }

  html[style*="dark"] .drawer-footer-done:hover {
    background: #3b82f6;
  }
</style>

<script>
  let currentActiveSelectEl = null;
  let currentActiveWrapper = null;

  // Which selects support multi-select
  const multiSelectIds = new Set(['currentToneEl', 'currentArchetypeEl', 'currentDynamicsEl']);

  // Maps select id -> global variable name for Perchance lists
  const selectToListNameMap = {
    'currentModeEl': 'modes',
    'currentSettingEl': 'worldSettings',
    'currentToneEl': 'tones',
    'currentArchetypeEl': 'archetypes',
    'currentDynamicsEl': 'dynamics',
    'currentCharacterCountEl': 'characterCounts',
    'currentGenderEl': 'genders'
  };

  // Maps select id -> global variable name for multi-select state (in Perchance lists)
  const multiSelectGlobalMap = {
    'currentToneEl': 'currentTones',
    'currentArchetypeEl': 'currentArchetypes',
    'currentDynamicsEl': 'currentDynamicsList'
  };

  // Maps select id -> localStorage key for multi-select
  const multiSelectStorageMap = {
    'currentToneEl': 'currentTones',
    'currentArchetypeEl': 'currentArchetypes',
    'currentDynamicsEl': 'currentDynamicsList'
  };

  // In-memory multi-select state: { selectId -> Set<value> }
  const multiSelectState = {};

  // Initialize multi-select state from localStorage
  function initMultiSelectState() {
    for (const [id, storageKey] of Object.entries(multiSelectStorageMap)) {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
        multiSelectState[id] = new Set(stored);
      } catch {
        multiSelectState[id] = new Set();
      }
    }
  }

  // Persist multi-select state and update global Perchance variable
  function saveMultiSelectState(selectId) {
    const storageKey = multiSelectStorageMap[selectId];
    const globalVar = multiSelectGlobalMap[selectId];
    if (!storageKey || !globalVar) return;
    const arr = Array.from(multiSelectState[selectId] || []);
    localStorage.setItem(storageKey, JSON.stringify(arr));
    // Update Perchance global variable
    if (typeof window !== 'undefined') {
      window[globalVar] = arr;
    }
  }

  // Update trigger label + badge for a multi-select
  function updateMultiSelectLabel(selectEl, wrapper) {
    const labelSpan = wrapper.querySelector('.custom-select-label');
    if (!labelSpan) return;
    const sel = multiSelectState[selectEl.id];
    if (!sel || sel.size === 0) {
      // Fallback to the first option text (the "Any" default)
      labelSpan.textContent = selectEl.options[0] ? selectEl.options[0].textContent : '';
      // Remove badge if it exists
      const existingBadge = wrapper.querySelector('.custom-select-badge');
      if (existingBadge) existingBadge.remove();
      return;
    }
    // Show first selected item text + badge if more
    const values = Array.from(sel);
    const firstOpt = Array.from(selectEl.options).find(o => o.value === values[0]);
    labelSpan.textContent = firstOpt ? firstOpt.textContent : values[0];
    // Badge
    let badge = wrapper.querySelector('.custom-select-badge');
    if (sel.size > 1) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'custom-select-badge';
        labelSpan.after(badge);
      }
      badge.textContent = `+${sel.size - 1}`;
    } else {
      if (badge) badge.remove();
    }
  }

  const gradients = [
    'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
    'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
    'linear-gradient(135deg, #f6d365 0%, #fda085 100%)',
    'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)',
    'linear-gradient(135deg, #a6c0fe 0%, #f1a7f1 100%)',
    'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)',
    'linear-gradient(135deg, #fdcbf1 0%, #e6dee9 100%)',
    'linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)',
    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
    'linear-gradient(135deg, #ff0844 0%, #ffb199 100%)',
    'linear-gradient(135deg, #f857a6 0%, #ff5858 100%)'
  ];

  function getGradientForString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return gradients[Math.abs(hash) % gradients.length];
  }

  function extractEmoji(text) {
    if (!text) return 'âœ¨';
    try {
      const match = text.match(/(\p{Emoji_Presentation}|\p{Emoji}\uFE0F)/u);
      return match ? match[0] : text.charAt(0);
    } catch { return text.charAt(0); }
  }

  window.filterDrawerCards = function(query) {
    const clearBtn = document.getElementById('customDropdownSearchClear');
    const scrollBox = document.getElementById('customDropdownDrawerContent');
    if (!scrollBox) return;
    query = query.toLowerCase().trim();
    if (clearBtn) clearBtn.style.display = query ? 'block' : 'none';
    scrollBox.querySelectorAll('.custom-select-card').forEach(card => {
      const title = (card.querySelector('.card-title')?.textContent || '').toLowerCase();
      const desc  = (card.querySelector('.card-description')?.textContent || '').toLowerCase();
      card.style.display = (title.includes(query) || desc.includes(query)) ? 'flex' : 'none';
    });
  };

  window.clearDrawerSearch = function() {
    const inp = document.getElementById('customDropdownSearchInput');
    if (inp) { inp.value = ''; filterDrawerCards(''); inp.focus(); }
  };

  // Close drawer (Done button)
  window.closeDrawer = function() {
    const drawer = document.getElementById('customDropdownDrawer');
    drawer.classList.remove('open');
    if (currentActiveWrapper) currentActiveWrapper.classList.remove('open');
    currentActiveSelectEl = null;
    currentActiveWrapper = null;
  };

  // Clear multi-select (Clear button)
  window.clearMultiSelect = function() {
    if (!currentActiveSelectEl) return;
    const id = currentActiveSelectEl.id;
    if (!multiSelectIds.has(id)) return;
    multiSelectState[id] = new Set();
    saveMultiSelectState(id);
    // Reset all card selected states in drawer
    const scrollBox = document.getElementById('customDropdownDrawerContent');
    if (scrollBox) {
      scrollBox.querySelectorAll('.custom-select-card').forEach(c => c.classList.remove('selected'));
    }
    updateMultiSelectLabel(currentActiveSelectEl, currentActiveWrapper);
  };

  function buildCard(opt, idx, selectEl, wrapper, isMulti, scrollBox) {
    const card = document.createElement('div');
    card.dataset.value = opt.value;
    card.dataset.index = idx;

    // Determine selected state
    let isSelected = false;
    if (isMulti) {
      isSelected = (multiSelectState[selectEl.id] || new Set()).has(opt.value);
    } else {
      isSelected = idx === selectEl.selectedIndex;
    }
    card.className = 'custom-select-card' + (isSelected ? ' selected' : '');

    // Retrieve image/description from Perchance list object
    let imageUrl = null, description = '';
    const listName = selectToListNameMap[selectEl.id];
    if (listName) {
      try {
        const listObj = window[listName];
        const itemObj = listObj && listObj[opt.value];
        if (itemObj) {
          const rawImg = String(itemObj.image ?? '').trim();
          if (rawImg && rawImg !== 'undefined') imageUrl = rawImg;
          const rawDesc = String(itemObj.description ?? '').trim();
          if (rawDesc && rawDesc !== 'undefined') description = rawDesc;
        }
      } catch (e) { /* silent */ }
    }

    // Thumbnail
    const imgWrapper = document.createElement('div');
    imgWrapper.className = 'card-image-wrapper';
    const fallback = document.createElement('div');
    fallback.className = 'card-image-fallback';
    fallback.style.background = getGradientForString(opt.textContent);
    fallback.textContent = extractEmoji(opt.textContent);

    if (imageUrl) {
      const img = document.createElement('img');
      img.className = 'card-image';
      img.alt = opt.textContent;
      img.src = imageUrl;
      img.onload  = () => { img.style.display = 'block'; fallback.style.display = 'none'; };
      img.onerror = () => { img.style.display = 'none';  fallback.style.display = 'flex'; };
      imgWrapper.appendChild(img);
      imgWrapper.appendChild(fallback);
    } else {
      fallback.style.display = 'flex';
      imgWrapper.appendChild(fallback);
    }

    // Content
    const contentWrapper = document.createElement('div');
    contentWrapper.className = 'card-content';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = opt.textContent;
    contentWrapper.appendChild(title);
    if (description) {
      const desc = document.createElement('div');
      desc.className = 'card-description';
      desc.textContent = description;
      contentWrapper.appendChild(desc);
    }

    // Checkmark (multi-select only)
    if (isMulti) {
      const check = document.createElement('div');
      check.className = 'card-check';
      check.textContent = 'âœ“';
      card.appendChild(check);
    }

    card.appendChild(imgWrapper);
    card.appendChild(contentWrapper);

    // Click handler
    card.addEventListener('click', (e) => {
      e.stopPropagation();

      if (isMulti) {
        // Toggle selection
        const sel = multiSelectState[selectEl.id] || new Set();
        if (sel.has(opt.value)) {
          sel.delete(opt.value);
          card.classList.remove('selected');
        } else {
          sel.add(opt.value);
          card.classList.add('selected');
        }
        multiSelectState[selectEl.id] = sel;
        saveMultiSelectState(selectEl.id);
        updateMultiSelectLabel(selectEl, wrapper);
      } else {
        // Single-select: update select element, fire change, close drawer
        selectEl.selectedIndex = idx;
        selectEl.dispatchEvent(new Event('change', { bubbles: true }));
        if (typeof selectEl.onchange === 'function') selectEl.onchange();
        const labelSpan = wrapper.querySelector('.custom-select-label');
        if (labelSpan) labelSpan.textContent = opt.textContent;
        scrollBox.querySelectorAll('.custom-select-card').forEach(c => {
          c.classList.toggle('selected', parseInt(c.dataset.index) === idx);
        });
        window.closeDrawer();
      }
    });

    return card;
  }

  function toggleSelectDrawer(selectEl, wrapper) {
    const drawer = document.getElementById('customDropdownDrawer');
    const scrollBox = document.getElementById('customDropdownDrawerContent');

    // Toggle off if same select clicked again
    if (currentActiveSelectEl === selectEl && drawer.classList.contains('open')) {
      window.closeDrawer();
      return;
    }

    // Close previous
    if (currentActiveWrapper) currentActiveWrapper.classList.remove('open');

    currentActiveSelectEl = selectEl;
    currentActiveWrapper = wrapper;
    wrapper.classList.add('open');

    const isMulti = multiSelectIds.has(selectEl.id);
    const originalOptions = Array.from(selectEl.options);
    const itemsCount = originalOptions.length;
    scrollBox.innerHTML = '';

    if (itemsCount === 0) { drawer.classList.remove('open'); return; }

    // Reset search
    const searchInput = document.getElementById('customDropdownSearchInput');
    if (searchInput) {
      searchInput.value = '';
      const clearBtn = document.getElementById('customDropdownSearchClear');
      if (clearBtn) clearBtn.style.display = 'none';
    }

    // Apply mode classes
    const showSearch = itemsCount > 4;
    const searchWrapper = document.getElementById('customDropdownSearchWrapper');
    if (showSearch) {
      drawer.classList.add('has-search');
      if (searchWrapper) searchWrapper.style.display = 'flex';
    } else {
      drawer.classList.remove('has-search');
      if (searchWrapper) searchWrapper.style.display = 'none';
    }

    if (isMulti) {
      drawer.classList.add('is-multi');
    } else {
      drawer.classList.remove('is-multi');
    }

    // Build cards
    originalOptions.forEach((opt, idx) => {
      scrollBox.appendChild(buildCard(opt, idx, selectEl, wrapper, isMulti, scrollBox));
    });

    drawer.classList.add('open');

    // Scroll to active card
    setTimeout(() => {
      let targetIdx;
      if (isMulti) {
        const sel = multiSelectState[selectEl.id];
        if (sel && sel.size > 0) {
          const firstVal = Array.from(sel)[0];
          targetIdx = originalOptions.findIndex(o => o.value === firstVal);
        }
      } else {
        targetIdx = selectEl.selectedIndex;
      }
      if (targetIdx != null && targetIdx >= 0) {
        const targetCard = scrollBox.children[targetIdx];
        if (targetCard) {
          scrollBox.scrollLeft = targetCard.offsetLeft - (scrollBox.clientWidth / 2) + (targetCard.clientWidth / 2);
        }
      }
    }, 20);
  }

  function initializeCustomSelect(selectEl) {
    if (!selectEl || selectEl.classList.contains('custom-select-hidden')) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'custom-select-wrapper';
    wrapper.id = 'custom-select-' + selectEl.id;

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'custom-select-trigger';

    const labelSpan = document.createElement('span');
    labelSpan.className = 'custom-select-label';
    const arrowSpan = document.createElement('span');
    arrowSpan.className = 'custom-select-arrow';
    arrowSpan.textContent = 'â–¼';
    trigger.appendChild(labelSpan);
    trigger.appendChild(arrowSpan);

    selectEl.parentNode.insertBefore(wrapper, selectEl.nextSibling);
    wrapper.appendChild(trigger);
    selectEl.classList.add('custom-select-hidden');

    function updateTriggerText() {
      if (multiSelectIds.has(selectEl.id)) {
        updateMultiSelectLabel(selectEl, wrapper);
      } else {
        const sel = selectEl.options[selectEl.selectedIndex];
        labelSpan.textContent = sel ? sel.textContent : '';
      }
    }

    updateTriggerText();

    // Keep trigger text in sync if select changes externally
    new MutationObserver(updateTriggerText)
      .observe(selectEl, { childList: true, attributes: true, subtree: true });

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSelectDrawer(selectEl, wrapper);
    });
  }

  // Close drawer when clicking outside
  document.addEventListener('click', (e) => {
    if (!currentActiveSelectEl) return;
    if (e.target.closest('.custom-select-trigger') || e.target.closest('#customDropdownDrawer')) return;
    window.closeDrawer();
  });

  function initAll() {
    initMultiSelectState();

    document.querySelectorAll('div[style*="flex-wrap:wrap"] select').forEach(select => {
      initializeCustomSelect(select);
    });

    const scrollBox = document.getElementById('customDropdownDrawerContent');
    if (scrollBox) {
      let isScrolling = false;
      scrollBox.addEventListener('wheel', (e) => {
        if (e.deltaY === 0) return;
        e.preventDefault();
        if (isScrolling) return;
        isScrolling = true;
        scrollBox.scrollBy({ left: (e.deltaY > 0 ? 1 : -1) * 252, behavior: 'smooth' });
        setTimeout(() => { isScrolling = false; }, 220);
      }, { passive: false });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }
</script>
